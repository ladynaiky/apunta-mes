<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const DEF = { nom: '', email: '', pw: '', pw2: '' };
const st = this.state || {};
const val = (k) => st[k] === undefined ? DEF[k] : st[k];
const tried = !!st.tried;
const v = { tried: tried };
const set = (k) => (e) => this.setState({ [k]: e.target.value });
const errs = {};
Object.keys(DEF).forEach((k) => { v[k] = val(k); v['set_' + k] = set(k); });
const CHECK = { nom: (x) => !x.trim() ? 'Escriu el teu nom.' : null, email: (x) => !x.trim() ? 'Escriu el correu electrònic.' : (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.trim()) ? null : 'Format de correu no vàlid (ex.: nom@exemple.cat).'),
pw: (x) => x.length < 8 ? 'Ha de tenir almenys 8 caràcters.' : null,
pw2: (x) => !x ? 'Torna a escriure la contrasenya.' : (x !== v.pw ? 'Les contrasenyes no coincideixen.' : null) };
Object.keys(CHECK).forEach((k) => {
const msg = CHECK[k](v[k]);
errs[k] = msg;
const show = !!msg && (tried || (st[k] !== undefined && v[k] !== ''));
v[k + 'Bad'] = show; v[k + 'Err'] = msg || ''; v[k + 'Cls'] = show ? 'err' : '';
});
['pw', 'pw2'].forEach((k) => { const s = !!st[k + 'Vis'];
v[k + 'Type'] = s ? 'text' : 'password'; v[k + 'Show'] = s; v[k + 'Hide'] = !s; v[k + 'EyeLabel'] = s ? 'Amagar la contrasenya' : 'Mostrar la contrasenya';
v[k + 'Eye'] = () => this.setState({ [k + 'Vis']: !s }); });
v.pwHelp = !v.pwBad; v.pwHelpTxt = 'Mínim 8 caràcters.'; v.nomHelp = false; v.emailHelp = false; v.pw2Help = !v.pw2Bad && !!v.pw2 && v.pw2 === v.pw; v.pw2HelpTxt = '✓ Les contrasenyes coincideixen.';
const rol = st.rol === undefined ? null : st.rol; const rolOpen = !!st.rolOpen;
v.rolOpen = rolOpen; v.rolLabel = rol || 'Tria el teu rol'; v.rolColor = rol ? '#1C1B1B' : '#434844'; v.rolRot = rolOpen ? 180 : 0;
v.rolBad = tried && !rol; v.rolBorder = v.rolBad ? '2px solid #BA1A1A' : (rolOpen ? '2px solid #1E5739' : '1px solid #747874');
v.toggleRol = () => this.setState({ rolOpen: !rolOpen });
v.rols = ['Alumne', 'Pares', 'Profe'].map((r) => ({ name: r, sel: r === rol, weight: r === rol ? 600 : 400, bg: r === rol ? '#F6C945' : 'transparent', pick: () => this.setState({ rol: r, rolOpen: false }) }));
const ok = !Object.keys(errs).some((k) => errs[k]) && !!rol;
v.ok = ok; v.notOk = !ok; v.submit = () => this.setState({ tried: true, rolOpen: false });
return { v: v };
}
}
</script>
