class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const SUBJ = [['Castellà', '#CC5500'], ['Català', '#B08800'], ['Anglès', '#9A6ADE'], ['Socials', '#2E8540'], ['Plàstica', '#00879A'], ['Música', '#D02670'], ['Mates', '#1F4FB8']];
const aOpen = !!st.aOpen;
const aSel = st.aSel || null;
const cur = aSel ? SUBJ.find((x) => x[0] === aSel) : null;
const subjects = [{ name: 'Totes', hasDot: false, dot: 'transparent' }].concat(SUBJ.map((x) => ({ name: x[0], hasDot: true, dot: x[1] }))).map((o) => {
const sel = o.name === (aSel || 'Totes');
return Object.assign(o, { sel: sel, off: !sel, bg: sel ? '#F6C945' : 'transparent', weight: sel ? 600 : 400,
pick: () => this.setState({ aSel: o.name === 'Totes' ? null : o.name, aOpen: false }) });
});
const WDN = ['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'];
const WDL = ['Dilluns', 'Dimarts', 'Dimecres', 'Dijous', 'Divendres', 'Dissabte', 'Diumenge'];
const dSel = st.dpDate || null;
const dPend = st.dpPend || null;
const dOpen = !!st.dpOpen;
const dDays = [];
for (let i = 0; i < 6; i++) dDays.push({ blank: true, real: false });
for (let d = 1; d <= 30; d++) {
const on = d === dPend;
const wi = (d + 5) % 7;
dDays.push({
blank: false, real: true, n: d, sel: on,
label: WDL[wi].toLowerCase() + ' ' + d + ' de novembre' + (d === 4 ? ', avui' : ''),
bg: on ? '#1E5739' : 'transparent',
fg: on ? '#FFFFFF' : '#1C1B1B',
border: on ? '0' : (d === 4 ? '1px solid #1E5739' : '0'),
weight: on || d === 4 ? 600 : 400,
pick: () => this.setState({ dpPend: d })
});
}
const dText = dSel ? WDL[(dSel + 5) % 7] + ' ' + dSel + ' de novembre' : 'Totes les dates';
const bf = {
q: st.q || '',
setQ: (e) => this.setState({ q: e.target.value }),
aOpen: aOpen,
aBorder: aOpen ? '2px solid #1E5739' : '1px solid #747874',
aText: aSel || 'Totes', aHasDot: !!cur, aDot: cur ? cur[1] : 'transparent',
aLabel: 'Assignatura: ' + (aSel || 'Totes'),
aToggle: () => this.setState({ aOpen: !aOpen, dpOpen: false }),
aClose: () => this.setState({ aOpen: false }),
subjects: subjects,
dText: dText, dLabel: 'Data: ' + dText,
dBorder: dOpen ? '2px solid #1E5739' : '1px solid #747874'
};
const dp = {
isOpen: dOpen, wd: WDN, days: dDays,
open: () => this.setState({ dpOpen: true, aOpen: false, dpPend: dSel }),
close: () => this.setState({ dpOpen: false }),
all: () => this.setState({ dpOpen: false, dpDate: null, dpPend: null }),
ok: () => this.setState({ dpOpen: false, dpDate: (this.state || {}).dpPend || null })
};
return { bf: bf, dp: dp };
}
}
