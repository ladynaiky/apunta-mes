<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
renderVals() {
const DEF = { email: '', pw: '' };
const st = this.state || {};
const val = (k) => st[k] === undefined ? DEF[k] : st[k];
const tried = !!st.tried;
const v = { tried: tried };
const set = (k) => (e) => this.setState({ [k]: e.target.value });
const errs = {};
Object.keys(DEF).forEach((k) => { v[k] = val(k); v['set_' + k] = set(k); });
const CHECK = { email: (x) => !x.trim() ? 'Escriu el correu electrònic.' : (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.trim()) ? null : 'Format de correu no vàlid (ex.: nom@exemple.cat).'), pw: (x) => !x ? 'Escriu la contrasenya.' : null };
Object.keys(CHECK).forEach((k) => {
const msg = CHECK[k](v[k]);
errs[k] = msg;
const show = !!msg && (tried || (st[k] !== undefined && v[k] !== ''));
v[k + 'Bad'] = show; v[k + 'Err'] = msg || ''; v[k + 'Cls'] = show ? 'err' : '';
});
['pw', 'pw2'].forEach((k) => { if (!(k in DEF)) return; const s = !!st[k + 'Vis'];
v[k + 'Type'] = s ? 'text' : 'password'; v[k + 'Show'] = s; v[k + 'Hide'] = !s; v[k + 'EyeLabel'] = s ? 'Amagar la contrasenya' : 'Mostrar la contrasenya';
v[k + 'Eye'] = () => this.setState({ [k + 'Vis']: !s }); });

const ok = !Object.keys(errs).some((k) => errs[k]);
v.ok = ok; v.notOk = !ok; v.submit = () => this.setState({ tried: true });
return { v: v };
}
}
