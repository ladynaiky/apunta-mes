<div class="row" [class.is-done]="done()">
  @if (showCheckbox()) {
    <ap-checkbox [checked]="done()" [label]="checkLabel()" (checkedChange)="doneChange.emit($event)" />
  } @else if (leadIcon()) {
    <!-- Mismo hueco que la casilla (48 dp): el texto queda alineado con el resto de tareas. -->
    <span class="lead" aria-hidden="true"><ap-icon [name]="leadIcon()!" /></span>
  }
  <button type="button" class="main" [attr.aria-label]="t.details(label())" (click)="open.emit()">
    <span class="title">
      @if (shownSubject()) {
        <span class="subject" [style.color]="subjectColor() ? 'var(--color-' + subjectColor() + ')' : null">{{ shownSubject() }}</span>: {{ label().slice(shownSubject()!.length + 2) }}
      } @else {
        {{ title() }}
      }
    </span>
    @if (supporting() || showTags()) {
      <span class="meta">
        @if (supporting()) {
          <span class="supporting">{{ supporting() }}</span>
        }
        @if (showTags()) {
          @if (done() ? tagOn('done') : tagOn('todo')) {
            <span class="tag" [class.tag-done]="done()">{{ done() ? t.done : t.todo }}</span>
          }
          @if (highPriority() && tagOn('highPriority')) {
            <span class="tag tag-priority">{{ t.highPriority }}</span>
          }
          @if (lowPriority() && tagOn('lowPriority')) {
            <span class="tag tag-low">{{ t.lowPriority }}</span>
          }
          @for (tg of userTags(); track tg.id) {
            <span class="tag tag-user" [style.background]="'var(--color-tag-' + tg.color + ')'" [style.color]="'var(--color-on-tag-' + tg.color + ')'">{{ tg.name }}</span>
          }
        }
      </span>
    }
  </button>
  @if (showMenu()) {
    <button apIconButton type="button" icon="more_vert" [label]="t.options" (click)="menu.emit()"></button>
  }
  <ng-content />
</div>
